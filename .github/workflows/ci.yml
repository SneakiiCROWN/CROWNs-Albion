name: CROWN'S ALBION CI

on:
  push:
    branches: [main]
    paths: ["src/**", "data/**", "tests/**", "tools/**", "Assets/CROWN_UI/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["src/**", "data/**", "tests/**", "tools/**", "Assets/CROWN_UI/**", ".github/workflows/ci.yml"]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build trainer
        run: powershell -ExecutionPolicy Bypass -File tools/build.ps1

      - name: Run data integrity tests
        run: powershell -ExecutionPolicy Bypass -File tests/check-data.ps1

      - name: Run engine safety tests
        run: powershell -ExecutionPolicy Bypass -File tests/check-source.ps1

      - name: Run engine behaviour tests
        shell: cmd
        run: tests\Run-Engine-Tests.cmd

      - name: Run UI regression tests
        shell: cmd
        run: tests\Run-UI-Tests.cmd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CROWNsAlbion-build
          path: "Exe, Menu/CROWNsAlbion.exe"
          retention-days: 7