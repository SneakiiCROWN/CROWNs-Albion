name: Build CROWN'S ALBION portable test download

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-albion-test.yml

permissions:
  contents: write

jobs:
  windows-offline-test-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run existing offline regression suite
        shell: cmd
        run: call tests\Run-All-Tests.cmd
      - name: Build portable trainer and include required JSON files
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build.ps1
          if ($LASTEXITCODE -ne 0) { throw "Trainer build failed" }
          if (-not (Test-Path "Exe, Menu/CROWNsAlbion.exe")) { throw "Executable missing" }
          if (-not (Test-Path "Exe, Menu/catalog.json")) { throw "Required catalogue missing" }
          @"
          CROWN'S ALBION - WINDOWS DEVELOPMENT TEST
          1. Extract the complete ZIP folder.
          2. Open CROWNsAlbion.exe to browse the menu.
          3. Do not try gameplay commands without reading the project setup and safety documentation.
          Live Fable III commands and co-op behaviour have NOT been verified.
          Keep CO-OP PROTECTION on. Back up game saves before experimenting.
          No Fable III game data, DLC, DLLs or injector are included.
          "@ | Set-Content -Path "Exe, Menu/READ-ME-FIRST.txt"
          Compress-Archive -Path "Exe, Menu/*" -DestinationPath "$env:RUNNER_TEMP/CROWNs-Albion-Windows-Test.zip" -Force
      - name: Preserve build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CROWNs-Albion-Windows-Test
          path: ${{ runner.temp }}/CROWNs-Albion-Windows-Test.zip
      - name: Attach downloadable Windows ZIP to test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "albion-test-${{ github.run_number }}" "$env:RUNNER_TEMP/CROWNs-Albion-Windows-Test.zip" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "CROWN'S ALBION Windows test build ${{ github.run_number }}" --notes "Offline-tested, portable menu/trainer development build. Extract ZIP and run CROWNsAlbion.exe. Individual Fable III game commands and co-op functionality remain unverified. Does not include the game, DLLs or injector." --prerelease
